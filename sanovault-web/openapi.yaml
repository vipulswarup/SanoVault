components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: session
      description: Website Neon Auth session cookie. Exact cookie name is managed by Neon Auth; present
        whenever the browser is signed in. Equivalent to bearer for `getCurrentUser()`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: mobile token
      description: Mobile session token from `/auth/mobile/*` (or minted via POST /auth/mobile/session).
    cronSecret:
      type: http
      scheme: bearer
      bearerFormat: CRON_SECRET
      description: 'Internal routes: `Authorization: Bearer <CRON_SECRET>`. `POST /internal/whatsapp/process`
        also accepts `WHATSAPP_INTERNAL_SECRET`.'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
      additionalProperties: true
    Ok:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    MobileNumber:
      type: object
      properties:
        countryCode:
          type: string
        number:
          type: string
    EmergencyContact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        relation:
          type: string
    HospitalIdentifier:
      type: object
      properties:
        systemName:
          type: string
        identifierType:
          type: string
        value:
          type: string
    MobileSession:
      type: object
      required:
      - token
      - expiresAt
      properties:
        token:
          type: string
          description: Bearer token for Authorization header
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
          description: Present on Apple sign-in
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
          nullable: true
        preferences:
          type: object
          additionalProperties: true
        onboardingCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Patient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
          nullable: true
        householdIds:
          type: array
          items:
            type: string
            format: uuid
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        title:
          type: string
        suffix:
          type: string
        emails:
          type: array
          items:
            type: string
        mobileNumbers:
          type: array
          items:
            $ref: '#/components/schemas/MobileNumber'
        dateOfBirth:
          type: string
          description: Calendar date or datetime from DB
        gender:
          type: string
        abhaNumber:
          type: string
        bloodGroup:
          type: string
        emergencyContacts:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyContact'
        preferences:
          type: object
          additionalProperties: true
        hospitalIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/HospitalIdentifier'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    HouseholdMember:
      type: object
      properties:
        householdId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        joinedAt:
          type: string
          format: date-time
    HouseholdInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        householdName:
          type: string
        email:
          type: string
        token:
          type: string
        invitedBy:
          type: string
          format: uuid
        invitedByName:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PublicHouseholdInvite:
      type: object
      properties:
        householdName:
          type: string
        invitedByName:
          type: string
        status:
          type: string
        expiresAt:
          type: string
          format: date-time
    HealthRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        recordType:
          type: string
        data:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        source:
          type: string
        doctorName:
          type: string
        documentDate:
          type: string
          nullable: true
        documentId:
          type: string
          format: uuid
        ocrText:
          type: string
        hospitalSystemName:
          type: string
        hospitalIdentifierType:
          type: string
        hospitalIdentifierValue:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        _id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fileName:
          type: string
        fileSize:
          type: integer
        fileType:
          type: string
        checksumSha256:
          type: string
        r2Key:
          type: string
        uploadedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - COMPLETED
          - FAILED
        ocrStatus:
          type: string
        ocrText:
          type: string
        aiStatus:
          type: string
        classification:
          type: string
        extractedData:
          type: object
          additionalProperties: true
        suggestedTags:
          type: array
