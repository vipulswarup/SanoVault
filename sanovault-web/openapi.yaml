# SanoVault HTTP API — OpenAPI 3.0.3
# Source of truth for shapes: Next.js App Router handlers under app/api/
# and shared mappers in lib/. See README.md API section for the route table.
#
# Generated for documentation; keep in sync when changing public/mobile routes.

openapi: 3.0.3
info:
  title: SanoVault HTTP API
  version: 1.0.0
  description: |-
    HTTP API for the SanoVault website and mobile app.

    All routes live under `/api`. Authenticated routes accept either the website cookie session (Neon Auth) or `Authorization: Bearer <mobile token>` as resolved by `getCurrentUser()` / `getAuthenticatedUser()` in `lib/auth/session.ts`.

    This specification covers the public/mobile-relevant surface summarized in `sanovault-web/README.md` (API section), grounded in the Next.js App Router handlers under `app/api/`.

    Not fully detailed here (exist in the codebase but outside the README table, or nested response shapes left open): care-share token routes (`/api/care/*`, `/api/care-shares`), API tokens (`/api/api-tokens`), patient overview/export, health-record summary/category-resolve, and deep nested fields inside blood-summary / doctor-packet lab objects.
  contact:
    name: Argali Knowledge Services Private Limited
    url: https://www.sanovault.com
  license:
    name: SEE LICENSE IN LICENSE
servers:
- url: https://www.sanovault.com/api
  description: Production
- url: http://localhost:3001/api
  description: Local development
tags:
- name: Auth
  description: Neon Auth passthrough and mobile bearer sessions
- name: Account
  description: Profile, consent, devices, privacy, deletion
- name: Home
  description: Dashboard and active household
- name: Families
  description: Households, members, invites, patient links
- name: People
  description: Patients and file passwords
- name: Reports
  description: Health records, categories, sources, doctors
- name: Documents
  description: Upload, preview, share
- name: AI and OCR
  description: OCR and Groq-backed analysis (consent gated)
- name: Medicines
  description: Medications, catalogue, photo extract
- name: Vitals
  description: Blood pressure and growth
- name: Tracking
  description: Vaccinations and visit notes
- name: Doctor
  description: Doctor packet and blood summary
- name: WhatsApp
  description: Webhook and sender map
- name: Internal
  description: Cron / secret-protected maintenance routes
paths:
  /auth/{path}:
    get:
      summary: Neon Auth catch-all (GET)
      tags:
      - Auth
      responses:
        '200':
          description: Neon Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: Proxied to Neon Auth `auth.handler()` (Next.js catch-all `app/api/auth/[...path]`). Protocol
        is owned by Neon Auth; not re-specified here. The `{path}` parameter stands in for one or more
        path segments.
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          description: Neon Auth subpath (catch-all; may represent nested segments)
    post:
      summary: Neon Auth catch-all (POST)
      tags:
      - Auth
      responses:
        '200':
          description: Neon Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: Proxied to Neon Auth `auth.handler()`.
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Neon Auth catch-all (PUT)
      tags:
      - Auth
      responses:
        '200':
          description: Neon Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: Proxied to Neon Auth `auth.handler()`.
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Neon Auth catch-all (PATCH)
      tags:
      - Auth
      responses:
        '200':
          description: Neon Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: Proxied to Neon Auth `auth.handler()`.
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Neon Auth catch-all (DELETE)
      tags:
      - Auth
      responses:
        '200':
          description: Neon Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      description: Proxied to Neon Auth `auth.handler()`.
      security: []
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
  /auth/mobile/apple:
    post:
      summary: Sign in with Apple (mobile)
      tags:
      - Auth
      responses:
        '201':
          description: Mobile session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSession'
        '400':
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Apple verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - identityToken
              properties:
                identityToken:
                  type: string
                  minLength: 20
                authorizationCode:
                  type: string
                  minLength: 1
                fullName:
                  type: string
                  nullable: true
                  maxLength: 160
                email:
                  type: string
                  format: email
                  nullable: true
  /auth/mobile/password:
    post:
      summary: Email/password sign-in (mobile)
      tags:
      - Auth
      responses:
        '201':
          description: Mobile session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSession'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
  /auth/mobile/session:
    post:
      summary: Mint mobile bearer from existing web/API session
      tags:
      - Auth
      responses:
        '201':
          description: Mobile session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSession'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Uses `getAuthenticatedUser()` (cookie or bearer). Does not require beta acknowledgement.
      security:
      - cookieSession: []
      - bearerAuth: []
    delete:
      summary: Revoke current mobile bearer token
      tags:
      - Auth
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Revokes the token in the Authorization header when present.
      security:
      - cookieSession: []
      - bearerAuth: []
  /users/me:
    get:
      summary: Get current profile
      tags:
      - Account
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
    put:
      summary: Update current profile
      tags:
      - Account
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                  nullable: true
                preferences:
                  type: object
                  additionalProperties: true
                onboardingCompleted:
                  type: boolean
  /users/beta-acknowledgement:
    get:
      summary: Get beta acknowledgement and Groq AI consent state
      tags:
      - Account
      responses:
        '200':
          description: Ack state
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  version:
                    type: string
                  acceptedAt:
                    type: string
                    format: date-time
                    nullable: true
                  groqAiEnabled:
                    type: boolean
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Uses `getAuthenticatedUser()` (no beta gate).
      security:
      - cookieSession: []
      - bearerAuth: []
    post:
      summary: Store beta acknowledgement and Groq AI choice
      tags:
      - Account
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  version:
                    type: string
                  groqAiEnabled:
                    type: boolean
                  acceptedAt:
                    type: string
                    format: date-time
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - groqAiEnabled
              properties:
                version:
                  type: string
                  enum:
                  - '2026-09-25'
                groqAiEnabled:
                  type: boolean
  /users/groq-ai-consent:
    patch:
      summary: Toggle Groq AI processing consent
      tags:
      - Account
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - enabled
              properties:
                enabled:
                  type: boolean
  /users/me/deletion:
    get:
      summary: Preview account deletion impact
      tags:
      - Account
      responses:
        '200':
          description: Deletion preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  families:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        will_delete:
                          type: boolean
                  needsAppleReauthentication:
                    type: boolean
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Uses `getAuthenticatedUser()` (no beta gate).
      security:
      - cookieSession: []
      - bearerAuth: []
    post:
      summary: Confirm account erasure
      tags:
      - Account
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: APPLE_REAUTH_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - confirmation
              properties:
                confirmation:
                  type: string
                  enum:
                  - DELETE
                appleAuthorizationCode:
                  type: string
                  minLength: 1
  /users/onboarding/complete:
    post:
      summary: Mark onboarding completed
      tags:
      - Account
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
  /privacy:
    get:
      summary: Privacy policy JSON
      tags:
      - Account
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  updated:
                    type: string
                  operator:
                    type: string
                  email:
                    type: string
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        text:
                          type: string
      security: []
  /devices:
    post:
      summary: Register push device token
      tags:
      - Account
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - platform
              properties:
                token:
                  type: string
                  minLength: 8
                  maxLength: 4096
                platform:
                  type: string
                  enum:
                  - ios
                  - android
  /dashboard:
    get:
      summary: Active household home payload
      tags:
      - Home
      responses:
        '200':
          description: Dashboard home
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardHome'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
  /me/active-household:
    get:
      summary: Get preferred active household id
      tags:
      - Home
      responses:
        '200':
          description: Active household
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId:
                    type: string
                    format: uuid
                    nullable: true
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
    patch:
      summary: Set active household preference
      tags:
      - Home
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  householdId:
                    type: string
                    format: uuid
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - householdId
              properties:
                householdId:
                  type: string
                  format: uuid
  /households:
    get:
      summary: List households for current user
      tags:
      - Families
      responses:
        '200':
          description: Households
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Household'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
    post:
      summary: Create household
      tags:
      - Families
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
  /households/{id}:
    get:
      summary: Get household
      tags:
      - Families
      responses:
        '200':
          description: Household
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
    patch:
      summary: Rename household
      tags:
      - Families
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
    delete:
      summary: Delete family
      tags:
      - Families
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
  /households/{id}/members:
    get:
      summary: List household members
      tags:
      - Families
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdMember'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
  /households/{id}/members/{userId}:
    delete:
      summary: Remove household member
      tags:
      - Families
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Member user id
  /households/{id}/invites:
    get:
      summary: List household invites
      tags:
      - Families
      responses:
        '200':
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseholdInvite'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - cookieSession: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id (UUID)
    post:
      summary: Create household invite
      tags:
      - Families
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/HouseholdInvite'
                - type: object
                  properties:
                    emailSent:
                      type: boolean
                    emailError:
                      type: string
                      nullable: true
